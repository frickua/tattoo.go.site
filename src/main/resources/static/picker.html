<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Photo importer</title>
    <meta charset="utf-8" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .container { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #202124; margin-bottom: 24px; }
        #picker-btn { padding: 12px 24px; background-color: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 500; transition: background 0.2s; }
        #picker-btn:hover { background-color: #357ae8; }
        #status { margin-top: 20px; color: #5f6368; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Photo Importer</h1>
    <button id="picker-btn">Додати фото з Google</button>
    <p>Необхідно обрати фотографії у власному google photo. Вони будуть скопійовані в альбом Anton Solinyk\TattooGO</p>
    <div style="text-align: left;">
    <p>Опис фотографій у форматі(кожне з нової строки)</p>
    <ul>
        <li>Заголовок, назва</li>
        <li>Стиль</li>
        <li>Автор</li>
        <li>Ціна</li>
    </ul>
    </div>
    <div id="status">Loading Google Identity Services...</div>
    <div id="photo-gallery" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
    const CLIENT_ID = '481370185603-9es1nm32g1d3i8k4sv5r6a97s3a3aq78.apps.googleusercontent.com';
    const SCOPE = 'https://www.googleapis.com/auth/photospicker.mediaitems.readonly';
    const REDIRECT_URI = `${window.location.origin}/picker`;
    let client;

    window.onload = function () {
        // 2. Check if we just returned from a redirect
        handleRedirectResponse();

        // 3. Initialize the Client in Redirect Mode
        client = google.accounts.oauth2.initCodeClient({
            client_id: CLIENT_ID,
            scope: SCOPE,
            ux_mode: 'redirect',
            redirect_uri: REDIRECT_URI,
            state: 'optional_state_value' // Use this to maintain app state
        });

        document.getElementById('status').innerText = "Ready.";
    };

    // Triggered by button click
    document.getElementById('picker-btn').onclick = () => {
        document.getElementById('status').innerText = "Redirecting to Google...";
        client.requestCode();
    };

    // 4. Logic to parse the URL fragment for the access token
    function handleRedirectResponse(intervalId) {
        console.log('handleResponse')
        const fragment = window.location.search.substring(1);
        const params = new URLSearchParams(fragment);
        const accessToken = params.get('accessToken');
        const error = params.get('error');

        if (accessToken) {
            clearInterval(intervalId);
            // Clear the fragment from the URL for security/cleanliness
            window.history.replaceState({}, document.title, window.location.pathname);
                // 3. Передача токена в Picker API
                document.getElementById('status').innerText = "Authenticated! Creating Picker session...";
                createPickerSession(accessToken);

        } else if (error) {
            clearInterval(intervalId);
            document.getElementById('status').innerText = "Auth Error: " + error;
        }
    }

    // 5. Create the session (Backend call simulated via Fetch)
    async function createPickerSession(token) {
        try {
            const response = await fetch('https://photospicker.googleapis.com/v1/sessions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify( {})
            });

            const session = await response.json();
            console.log(session)
            if (session.pickerUri) {
                document.getElementById('status').innerText = "Opening Picker...";
                // Append /autoclose so the window shuts after selection
                const pickerWindow = window.open(session.pickerUri + "/autoclose", "_blank");
                // Перевіряємо кожну секунду, чи закрилося вікно
                // getPickedItems(session.id, token);
                await fetch(`/media-items?sessionId=${session.id}&accessToken=${token}`);
                window.location.href = "/"
            } else {
                document.getElementById('status').innerText = "Session Error: Check console.";
                console.error("Session failed:", session);
            }
        } catch (err) {
            document.getElementById('status').innerText = "Fetch Error: " + err.message;
        }
    }
</script>
</body>
</html>
